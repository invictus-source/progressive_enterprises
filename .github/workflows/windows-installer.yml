name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version (for example 1.0.0)
        required: true
        default: 1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up 64-bit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip

      - name: Create build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Resolve installer version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use MAJOR.MINOR.PATCH format. Received: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build and validate installer
        shell: pwsh
        run: .\build_installer.ps1 -Version "${{ steps.version.outputs.value }}" -SkipDependencyInstall

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ProgressiveEnterprises-Windows-${{ steps.version.outputs.value }}
          path: |
            installers/*.exe
            installers/*.sha256
          if-no-files-found: error
          retention-days: 30
